# Clash Verge Rev 全局扩展配置模板
# 复制后把占位符替换为自己的私有域名和 DNS；不要把真实内部信息提交到公开仓库。
# 需配合本仓库的全局扩展脚本：脚本会保留任意显式的 +.私有域名 DNS 策略。
# 此文件不推断路由；请在订阅的「编辑规则」中另加 DOMAIN-SUFFIX,internal.example,DIRECT。
# 不要在这里添加 rules，旧版/部分版本会整体覆盖订阅规则。

dns:
  nameserver-policy:
    "+.internal.example":
      - "https://223.5.5.5/dns-query"
      - "https://1.12.12.12/dns-query"

queryStrategy: "UseIPv4"
