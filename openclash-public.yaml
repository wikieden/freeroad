# Freeroad OpenClash PUBLIC starter (Mihomo/Meta).
# Replace proxy-providers.airport.url and secret LOCALLY before use.
# Not a working subscription; never publish your filled copy.
# Upload this full YAML, not the JS or the FlClash split bootstrap.
# OpenClash must configure firewall, traffic capture and DNS forwarding.
# Router integration is not verified by desktop syntax validation.
---
proxy-providers:
  airport:
    type: http
    url: https://subscription.example.net/replace-me.yaml
    path: "./proxy_provider/freeroad-airport.yaml"
    header:
      User-Agent:
      - clash.meta
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
ipv6: false
unified-delay: true
tcp-concurrent: true
disable-keep-alive: false
mode: rule
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  fake-ip-filter:
  - localhost
  - "*.lan"
  - "*.local"
  - "*.localhost"
  - "+.ntp.org.cn"
  - "+.pool.ntp.org"
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    geosite:apple:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    geosite:microsoft:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    geosite:cn:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    geosite:geolocation-!cn:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
      override-destination: true
  skip-domain:
  - Mijia Cloud
  - "+.push.apple.com"
  - "+.apple.com"
proxies: []
proxy-groups:
- name: "\U0001F9E0 Claude"
  type: select
  proxies:
  - "♻️ 美国自动"
  - "\U0001F1FA\U0001F1F8 美国全部节点"
  - "♻️ 台湾自动"
  - "\U0001F30F 台湾全部节点"
  - "♻️ 日本自动"
  - "\U0001F1EF\U0001F1F5 日本全部节点"
  - "♻️ 新加坡自动"
  - "\U0001F1F8\U0001F1EC 新加坡全部节点"
  use:
  - airport
  filter: "(?i)(?:\U0001F1FA\U0001F1F8|USA|(?:^|[^A-Za-z])US(?:$|[^A-Za-z])|United[
    _-]?States|America|美国|洛杉矶|圣何塞|硅谷|Seattle|New[ _-]?York|Dallas|Chicago|Phoenix|西雅图|纽约|芝加哥|达拉斯|凤凰城)|(?:\U0001F1EF\U0001F1F5|(?:^|[
    _-])JP(?:$|[ _-])|Japan|Tokyo|Fukuoka|Nagoya|日本|东京|大阪|福冈|福岡|名古屋)|(?:\U0001F1F8\U0001F1EC|(?:^|[
    _-])SG(?:$|[ _-])|Singapore|新加坡|狮城)|(?:\U0001F1F9\U0001F1FC|(?:^|[ _-])TWN?(?:$|[
    _-])|Taiwan|Taipei|Taichung|Kaohsiung|台湾|台灣|台北|台中|高雄|新北)"
  exclude-filter: "(?i)支持[ _-]*AI[ :：]|流量(?:剩余|不足|耗尽|重置|用尽)|重置|过期|到期|套餐|官网|发布|公告|网站|网址|不懂|剩余|续费|购买|客服"
